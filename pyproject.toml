[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-retrieval"
version = "0.1.0"
description = "Semantic Retrieval: A process-aware orchestration architecture for LLM-based agent orchestration"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.50,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black", "ruff"]
